name: Recover source transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-source.yml', '.recovery/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inspect previously uploaded source fragments
        shell: python
        run: |
          import pathlib, gzip, zlib, tarfile, io, json, hashlib
          files = sorted(pathlib.Path('.recovery').glob('blob-*'))
          chunks = [f.read_bytes() for f in files]
          for f, b in zip(files, chunks):
              print(f.name, len(b), 'header=' + b[:24].hex(), 'sha256=' + hashlib.sha256(b).hexdigest())
              if b.startswith(b'\x1f\x8b'):
                  d = zlib.decompressobj(31)
                  try:
                      raw = d.decompress(b)
                      print('GZIP PREVIEW', repr(raw[:300]), 'eof=', d.eof, 'output=', len(raw))
                  except Exception as e:
                      print('DECOMPRESS', str(e))
          combined = b''.join(chunks)
          pathlib.Path('/tmp/astrum-recovery').mkdir(exist_ok=True)
          pathlib.Path('/tmp/astrum-recovery/combined.bin').write_bytes(combined)
          for offset in range(len(chunks)):
              try:
                  raw = gzip.decompress(b''.join(chunks[offset:]))
              except Exception as e:
                  print('JOIN', offset, type(e).__name__, str(e))
                  continue
              print('COMPLETE GZIP', offset, len(raw), repr(raw[:100]))
              pathlib.Path('/tmp/astrum-recovery/recovered-' + str(offset)).write_bytes(raw)
              try:
                  with tarfile.open(fileobj=io.BytesIO(raw)) as t:
                      print('TAR FILES', json.dumps(t.getnames()))
              except Exception:
                  pass
      - uses: actions/upload-artifact@v4
        with:
          name: source-recovery-inspection
          path: /tmp/astrum-recovery
          retention-days: 1
