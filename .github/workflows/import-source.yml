name: Import complete Astrum source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: read
concurrency:
  group: astrum-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Reconstruct and verify complete source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, json, urllib.request, base64, pathlib, hashlib, lzma, tarfile, io, shutil, time
          shas = '''f99a9cce47f3baf357810867577fdb90c7264bab e2c27576f25873eec603186bb86e6f298c93e194 27509287008db122172bfb51e9fb9d92f52e8d44 c23ba92417ecde0fa26149318a2cbc8a55f1374a 08186bf9a047e2826a6aed6e28e6391635ef18f0 01b95d95a265d33faa589e19020f84a52b5ba981 3883162c7b0c33dd1dd57d5f9edd4e3f57de6cf2 a04b8c36ce642b7c93b0bcf7bcbebc4b3b75086b 48d3a4050a88b4f7df1ce14117b91cd131450e3f c907390f63a54445b20cebff0f5fb3ca643ecc3e e68336d2ba85c0ece4beb04ec7a5a1a23939550c 7f11eb8a1ba339aba206bfbf11148ccf1ba1deb3 73824c29f95c0ede924deb20a8b0f1e557a90ee3 8983badc2e1f10ed5d3c90916b17cfd7f0595d7e 8999aa945ed16a50c37ba763b18aa882dc1a543a f6b76ee310f13b5d7a757fded607eebb2f60c4f4 1a646bfa8f518e799327780f0707a229bc09bd19 433b300f232c676e0759d4fb77846484ce69882b 4dba3356c993dca5ceb5fef2286673b1dd9ed4bd b7e8a2490c0748f5dad55eb106df5015c4b0d104 ea219ea6afba1417e2ac5c4b52952459587bd860 89b45dbfa347fa81c7f9bce94fbdc07ca257542a dbaa8d607d966823542fcaebbf2ac018e83f1b45 25fdcd6f5e84c3983660c2fcaaf546850461fc5f'''.split()
          def fetch(url, headers=None):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=headers or {}), timeout=60) as response:
                          return response.read()
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(2 ** attempt)
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          chunks = []
          for sha in shas:
              data = json.loads(fetch('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha, headers))
              b = base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest() == sha, 'Blob mismatch: ' + sha
              chunks.append(b)
          archive = b''.join(chunks)
          expected = '37177999cf54a665e333a13bee32aeb71f1555af714ec6e16b69992584541735'
          assert len(archive) == 190148 and hashlib.sha256(archive).hexdigest() == expected, 'Transfer checksum mismatch'
          payload = json.loads(lzma.decompress(archive))
          assert payload['format'] == 1 and len(payload['files']) == 156
          manifest = {}
          for name, text in payload['files'].items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in ('.git', '.github'), name
              assert isinstance(text, str)
              target = pathlib.Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              b = text.encode('utf-8')
              target.write_bytes(b)
              manifest[name] = hashlib.sha256(b).hexdigest()
          vendor = {
              'THREE-LICENSE.txt': '8b378ebe60e2fe500158cb0ac71cb5e8b7d92953c2abcc63a0eb90499653b5bc',
              'addons/controls/OrbitControls.js': 'faabb4e8dfd9235ee4a9fd7c9a3d75f90f1689dbd4944bd6fd32117dacec5f93',
              'addons/controls/TransformControls.js': '5ab530936807ad7930147a4ee8132d2def576a00428a46784a9e1e0a44c12c65',
              'addons/environments/RoomEnvironment.js': '55f466192cc84298755a424c5e040345006b2ee1455589b3b54126c2ea4123f4',
              'addons/exporters/GLTFExporter.js': '380af42ac1b503c43e0430dd56ade34e3e76317b1b1cc702f452b87d6fece404',
              'addons/loaders/GLTFLoader.js': '97642d720f16cc9a0c9844934198e4d0c023bea8e89576d0f7545d03b2d103d2',
              'addons/loaders/OBJLoader.js': '86c8384e269b75a21d502d438e3f0dc2e09dc61b6e6da6b81947f5b119112bf8',
              'addons/loaders/STLLoader.js': '023ed97f848b633d8bcd53d4db3b996d29d0c644088700691297c552257d480b',
              'addons/utils/BufferGeometryUtils.js': 'd700b4c4584b9ff53a04692624d2363019f6d1df2978a207389168c6ae647a65',
              'addons/utils/SkeletonUtils.js': 'b1632a703206c3d830de9fcbe515696770d04b71a15ee6b50afa6d2c3298c86f',
              'three.core.js': '368dc78835287709a48939e8eb9a7a61d0732098bdf916e56840d458aae9ccf3',
              'three.tsl.js': 'e6c3b8f03ef9e4a2fdf5500db72399a2e36574287e55190c9e641bc72968e436',
              'three.webgpu.js': '444f623f1dc99228ee6fc68b68f83a8e1741059363df9796c48a68925ca05363'
          }
          with tarfile.open(fileobj=io.BytesIO(fetch('https://registry.npmjs.org/three/-/three-0.184.0.tgz')), mode='r:gz') as package:
              for name, digest in vendor.items():
                  source = 'package/LICENSE' if name == 'THREE-LICENSE.txt' else 'package/examples/jsm/' + name[7:] if name.startswith('addons/') else 'package/build/' + name
                  b = package.extractfile(source).read()
                  assert hashlib.sha256(b).hexdigest() == digest, 'Vendor checksum mismatch: ' + name
                  target = pathlib.Path('public/studio/vendor') / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(b)
                  manifest[str(target)] = digest
          pathlib.Path('docs/SOURCE-IMPORT.json').write_text(json.dumps({'sourceArchiveSHA256': 'a067c49dcc080b624f776b85d0b8cc6209631291e38844f60f4b496fcd255d42', 'transferSHA256': expected, 'files': manifest}, indent=2) + '\n')
          shutil.rmtree('.recovery', ignore_errors=True)
          print('Verified and restored', len(manifest), 'source and bundled vendor files.')
      - name: Test engine, API and storage
        run: npm test
      - name: Build portable Pages app and standalone libraries
        run: |
          npm run build:pages
          npm run package:libraries
      - name: Commit complete source without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          git diff --cached --stat
          git commit -m 'feat: import complete Astrum Studio editor, libraries, server, tests and Pages build'
          git push origin HEAD:main
          echo "Imported source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Read Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{html_url,build_type,source,status}'
